<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Imarui IAM • Documentação da API</title>

    <link
            rel="stylesheet"
            type="text/css"
            href="/swagger-ui/swagger-ui.css"
    >

    <link
            rel="stylesheet"
            type="text/css"
            href="/openapi-custom/swagger-operation-groups.css"
    >
</head>

<body>
<header class="api-docs-header"><strong>Imarui IAM</strong><span>Contratos HTTP por módulo e feature</span><a href="/v3/api-docs" target="_blank" rel="noopener">OpenAPI JSON</a></header>
<div id="swagger-ui"></div>

<script src="/swagger-ui/swagger-ui-bundle.js"></script>

<script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>

<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/v3/api-docs",

            dom_id: "#swagger-ui",

            deepLinking: true,

            displayOperationId: false,

            filter: true,

            tryItOutEnabled: true,

            persistAuthorization: false,

            /*
             * Inicia todas as tags principais completamente fechadas.
             *
             * Não use "list", pois isso abre as tags e deixa os
             * subgrupos visíveis ao carregar a página.
             */
            docExpansion: "none",

            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],

            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],

            layout: "StandaloneLayout",

            tagsSorter: "alpha",

            operationsSorter: "alpha",

            onComplete: function () {
                /*
                 * Dispara um evento somente depois que o Swagger UI
                 * terminar de carregar a especificação e montar a tela.
                 */
                window.dispatchEvent(
                    new CustomEvent("swagger-ui-ready")
                );
            }
        });
    };
</script>

<script src="/openapi-custom/swagger-operation-groups.js"></script>
</body>
</html>
