spring:
  application:
    name: imarui-iam-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      hibernate:
        format_sql: false
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:imarui-iam-service}
  auth:
    session-ttl: ${SESSION_TTL:12h}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    password-recovery-request-ttl: ${PASSWORD_RECOVERY_TTL:15m}
    password-change-challenge-ttl: ${PASSWORD_CHANGE_CHALLENGE_TTL:5m}
app:
  server:
    base-url: ${APP_BASE_URL:http://localhost:8080}
