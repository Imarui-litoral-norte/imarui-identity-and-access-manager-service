spring:
  datasource:
    url: ${IDENTITY_TEST_DB_URL:jdbc:postgresql://localhost:15437/identity_test}
    username: identity_test
    password: identity_test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
security:
  auth:
    activation-invitation-ttl: 2h
    bcrypt-cost: 4
    require-https: false
    workers-enabled: false
    allowed-origins: https://frontend.example.test
  jwt:
    secret: identity-test-signing-material-for-isolated-tests-only
    issuer: identity-test
management:
  health:
    redis:
      enabled: false
