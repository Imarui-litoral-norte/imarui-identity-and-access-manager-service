name: Verify IIAM
on:
  pull_request:
  push:
    branches: [main, feat/iiams-39-authentication-jeep-migration, feat/iiams-81-authorization-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: identity_test
          POSTGRES_USER: identity_test
          POSTGRES_PASSWORD: identity_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U identity_test -d identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      IDENTITY_TEST_DB_URL: jdbc:postgresql://localhost:5432/identity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify migrations, domain, HTTP, PostgreSQL concurrency and regression
        env:
          IIAM_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/authorization-openapi.json
            target/authorization-benchmark.json
            target/authorization-operational-benchmark.json
            target/authorization-recovery-rehearsal.json
            target/authorization-audit-capacity.json
